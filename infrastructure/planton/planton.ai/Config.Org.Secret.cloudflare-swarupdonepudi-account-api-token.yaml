# The Cloudflare account API token Planton signs in with. Metadata only: the value is set from the
# clipboard through standard input and never appears in this repository.
#
#   planton apply -f Config.Org.Secret.cloudflare-swarupdonepudi-account-api-token.yaml --instance planton.ai --org swarup-donepudi
#   pbpaste | planton secret set cloudflare-swarupdonepudi-account-api-token --string --instance planton.ai --org swarup-donepudi
apiVersion: config-manager.planton.ai/v1alpha1
kind: Secret
metadata:
  name: cloudflare-swarupdonepudi-account-api-token
  slug: cloudflare-swarupdonepudi-account-api-token
  org: swarup-donepudi
spec:
  scope: organization
  description: >-
    The account API token `planton-swarupdonepudi` of the Cloudflare account `swarupdonepudi` (its rights and
    re-mint are in ../../vendors/cloudflare/README.md). Used by the CloudflareProviderConnection.
  backend: platform-default
  dataFormat: text
