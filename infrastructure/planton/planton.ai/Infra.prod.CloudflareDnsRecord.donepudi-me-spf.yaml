# SPF for donepudi.me: nothing sends mail as donepudi.me except Google, which relays the domain's inbound group
# mail (a Google Group rewrites a forwarded message's sender to the group's own address). Everything else fails.
#
#   planton apply -f Infra.prod.CloudflareDnsRecord.donepudi-me-spf.yaml --instance planton.ai --org swarup-donepudi
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsRecord
metadata:
  name: donepudi-me-spf
  org: swarup-donepudi
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      env: prod
      name: donepudi-me
      fieldPath: status.outputs.zone_id
  name: donepudi.me
  type: TXT
  content:
    value: 'v=spf1 include:_spf.google.com -all'
  ttl: 1
  comment: SPF, only Google may send
