# The Zero Trust team. Named swarup-donepudi when Zero Trust was switched on; this
# file names it, so sign-in happens at swarup-donepudi.cloudflareaccess.com.
#
#   planton apply -f Infra.prod.CloudflareZeroTrustOrganization.donepudi.yaml --instance planton.ai --org swarup-donepudi
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustOrganization
metadata:
  name: swarup-donepudi # permanent
  org: swarup-donepudi
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  accountId: $var/cloudflare-swarupdonepudi-account-id
  authDomain: swarup-donepudi.cloudflareaccess.com
  name: swarup-donepudi
  userSeatExpirationInactiveTime: 730h # a seat unused for a month is freed
