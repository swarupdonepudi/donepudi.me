# The door on the threads' private calls, hey.donepudi.me/threads/api and everything under it, never a
# thread's own page: the owner first, then the inbox sync, then the people invited to a thread.
#
#   planton apply -f Infra.prod.CloudflareZeroTrustAccessApplication.donepudi-me-threads.yaml --instance planton.ai --org swarup-donepudi
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessApplication
metadata:
  name: donepudi-me-threads
  org: swarup-donepudi
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  accountId: $var/cloudflare-swarupdonepudi-account-id
  name: donepudi.me threads
  type: self_hosted
  domain: hey.donepudi.me/threads/api
  sessionDuration: 168h
  allowedIdps:
    - valueFrom:
        kind: CloudflareZeroTrustAccessIdentityProvider
        env: prod
        name: one-time-pin
        fieldPath: status.outputs.identity_provider_id
  autoRedirectToIdentity: true
  appLauncherVisible: false
  policies:
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          env: prod
          name: donepudi-me-inbox-owner
          fieldPath: status.outputs.policy_id
      precedence: 1
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          env: prod
          name: donepudi-me-inbox-sync
          fieldPath: status.outputs.policy_id
      precedence: 2
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          env: prod
          name: donepudi-me-threads-members
          fieldPath: status.outputs.policy_id
      precedence: 3
