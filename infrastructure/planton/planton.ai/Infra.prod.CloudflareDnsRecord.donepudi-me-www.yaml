# www: a proxied name with no origin; the redirects ruleset sends it to the apex.
#
#   planton apply -f Infra.prod.CloudflareDnsRecord.donepudi-me-www.yaml --instance planton.ai --org swarup-donepudi
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsRecord
metadata:
  name: donepudi-me-www
  org: swarup-donepudi
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      env: prod
      name: donepudi-me
      fieldPath: status.outputs.zone_id
  name: www.donepudi.me
  type: AAAA
  content:
    value: '100::' # a discard address: only Cloudflare answers this name
  proxied: true
  ttl: 1
  comment: www; 301 to the apex by the redirects ruleset
