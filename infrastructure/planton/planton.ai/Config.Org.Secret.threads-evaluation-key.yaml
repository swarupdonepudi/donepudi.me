# The RSA private key (a JWK) that signs the site's answers to Access's sign-in question for invited people.
# Made and set by the script in ../../vendors/cloudflare/README.md, which also copies it to `production`.
#
#   planton apply -f Config.Org.Secret.threads-evaluation-key.yaml --instance planton.ai --org swarup-donepudi
apiVersion: config-manager.planton.ai/v1alpha1
kind: Secret
metadata:
  name: threads-evaluation-key
  slug: threads-evaluation-key
  org: swarup-donepudi
spec:
  scope: organization
  description: >-
    The RSA private key, as a JWK, that signs donepudi.me's answers to Cloudflare Access at sign-in. Copied to
    the GitHub environment `production` as THREADS_EVALUATION_KEY.
  backend: platform-default
  dataFormat: text
