# The one address the threads admit as the owner. Metadata only: the value goes in through standard input.
#
#   planton apply -f Config.Org.Secret.inbox-owner-email.yaml --instance planton.ai --org swarup-donepudi
#   printf %s '<address>' | planton secret set inbox-owner-email --string --instance planton.ai --org swarup-donepudi
apiVersion: config-manager.planton.ai/v1alpha1
kind: Secret
metadata:
  name: inbox-owner-email
  slug: inbox-owner-email
  org: swarup-donepudi
spec:
  scope: organization
  description: >-
    The owner's email address. Read by the Access policy donepudi-me-inbox-owner and copied to the GitHub
    environment `production` as INBOX_OWNER_EMAIL for the Worker's own check.
  backend: platform-default
  dataFormat: text
