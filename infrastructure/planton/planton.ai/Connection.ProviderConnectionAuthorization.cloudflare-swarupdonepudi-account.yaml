# Lets every environment of the organization use the Cloudflare connection.
#
#   planton apply -f Connection.ProviderConnectionAuthorization.cloudflare-swarupdonepudi-account.yaml --instance planton.ai --org swarup-donepudi
apiVersion: connect.planton.ai/v1alpha1
kind: ProviderConnectionAuthorization
metadata:
  name: cloudflare-swarupdonepudi-account
  org: swarup-donepudi
spec:
  provider: cloudflare
  connection: cloudflare-swarupdonepudi-account
  scope: organization
