# The apex: a proxied name with no origin, answered by the Worker's route `donepudi.me/*`.
#
#   planton apply -f Infra.prod.CloudflareDnsRecord.donepudi-me-apex.yaml --instance planton.ai --org swarup-donepudi
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsRecord
metadata:
  name: donepudi-me-apex
  org: swarup-donepudi
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      env: prod
      name: donepudi-me
      fieldPath: status.outputs.zone_id
  name: donepudi.me
  type: AAAA
  content:
    value: '100::' # a discard address: only Cloudflare answers this name
  proxied: true
  ttl: 1
  comment: Apex; answered by the Worker donepudi-me through its route
