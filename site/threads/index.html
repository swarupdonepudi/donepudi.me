<!DOCTYPE html>
<!-- hey.donepudi.me: Swarup's threads, the page the Worker hands over on the threads' host (site/hosts.js) at its
     root and each room (/, Today, the door everyone signed in enters by; /threads/; /people; /meetings; /asks) at
     every thread's own address, /threads/42,
     and at an ask's, /ask/<slug> (src/pages.ts). Today at / (the next meeting, notes waiting, threads waiting on him,
     new ones, and what sat a week), the Threads room at /threads/ (four tabs and the spaces), the Meetings room, the
     Asks room (his links that ask a few questions), and a thread: its meeting, its living summary on top, its main
     text, then comments and history in order. An ask's address draws its page for anyone, signed in or not, in the
     public view below, full screen, with an optional name and email above it.
     /app/threads.js draws all of it from the threads' private calls under /threads/api/, behind Cloudflare Access;
     the page itself holds no data. Until a call answers, nothing shows: a visitor who isn't signed in sees the
     same "Nothing here" a missing thread shows at a thread's address, and a small "Sign in" there only on a device that
     has signed in before; at / and at /threads/ itself, which name no thread, it always offers "Sign in". A person Swarup
     invited to a thread gets the same page, drawn for them: their threads, and each with a comment box. A thread
     Swarup made public is drawn for anyone who isn't in it in the public view below: the thread, the comments he
     made public, and a note form whose note waits for his OK. People (/people, and a person's page at
     /people/7-meera) are his alone: everyone he deals with, and a page for each. On a phone the bar holds Today,
     Threads, Find, New and More (People, Meetings, Asks); an invited person's holds their threads, their meetings and Find.
     Every link and file is root-absolute; the site's name (data-home) names / until the script points it at the home
     page's host, since / on this host is Today. The icons are a template the script copies. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">

      <div class="t-nav" data-nav></div>
      <button type="button" class="t-side-new" data-act="new"><span data-icon="plus"></span>New thread<kbd>N</kbd></button>
      <div class="t-side-foot"><span class="t-av t-av-me">S</span><span class="t-side-who">Swarup<small>Signed in</small></span><button type="button" class="t-icon-button" data-act="keys" aria-label="Keys"><span data-icon="keys"></span></button></div>
    </nav>
    <div class="t-main" data-main tabindex="-1"></div>
    <nav class="t-tabbar" aria-label="Sections" data-tabbar>
      <button type="button" data-go="today"><span data-icon="sun"></span>Today</button>
      <button type="button" data-go="meetings" data-member hidden><span data-icon="cal"></span>Meetings</button>
      <button type="button" data-go="list"><span data-icon="list"></span>Threads</button>
      <button type="button" data-act="find"><span data-icon="search"></span>Find</button>
      <button type="button" data-act="new"><span data-icon="plus"></span>New</button>
      <button type="button" data-act="more" aria-haspopup="dialog"><span data-icon="more"></span>More</button>
    </nav>
  </div>

  <div class="t-lost" data-lost hidden>
    <div class="t-lost-bar"><a class="t-lost-name" href="/" data-home>donepudi.me</a></div>
    <div class="t-lost-body">
      <h1 class="t-lost-title" data-lost-title>Nothing here</h1>
      <p class="t-lost-text" data-lost-text>There's nothing at this address.</p>
      <p class="t-lost-text" data-sign-in hidden><a data-sign-in-link href="/threads/">Sign in</a></p>
    </div>
  </div>

  <div class="t-pub" data-public hidden>
    <div class="t-pub-bar"><a href="/" data-home>donepudi.me</a><a class="t-pub-sign-in" data-public-sign-in href="/threads/" hidden>Sign in</a></div>
    <article class="t-pub-doc" data-public-doc></article>
  </div>

  <p class="t-banner" role="alert" data-banner hidden></p>

  <div class="t-toast" role="status" data-toast hidden>
    <span data-toast-text></span>
    <button type="button" class="t-toast-undo" data-act="undo">Undo <kbd>Z</kbd></button>
    <span class="t-toast-bar" data-toast-bar></span>
